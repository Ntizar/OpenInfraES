name: Refresco de datos vivos

# Problema P2 de la auditoría: los paneles «en vivo» servían fotos de hace 1-3 días porque el
# único workflow validaba en push y no había nada que regenerase los datos.
#
# Este workflow hace dos cosas:
#   1. cada 30 minutos, regenera las capas que cambian (demanda, precio, mix, avisos, sismos)
#   2. a diario, refresca el catálogo y comprueba que las cifras de la prosa siguen cuadrando
#
# Las capas que necesitan clave usan secrets; si falta una, ese paso se salta y NO rompe el
# workflow: el fichero anterior se queda y su fecha lo delata. Un dato viejo declarado vale más
# que un workflow rojo.

on:
  schedule:
    - cron: "7 * * * *"         # cada hora a los :07 UTC (antes */30: 48 commits/dia
                                 #  y choques con el cron horario de la VM)
    - cron: "23 5 3 * *"        # día 3 de cada mes: renta municipal del INE (dato anual)
  workflow_dispatch:            # y a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresco.yml"

permissions:
  contents: write

concurrency:
  group: refresco
  cancel-in-progress: false

jobs:
  vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet requests

      - name: Claves (.env)
        run: |
          # el .env existe siempre: los scripts que leen clave saben saltarse una linea vacia,
          # pero no un fichero que no esta (antes eso era un traceback, no un salto limpio)
          : > .env
          # solo se escriben las que existan como secret; las demas quedan vacias y su script
          # se salta en vez de fallar
          [ -n "${{ secrets.ESIOS_TOKEN }}" ] && echo "ESIOS_TOKEN=${{ secrets.ESIOS_TOKEN }}" >> .env || true
          [ -n "${{ secrets.ENTSOE_TOKEN }}" ] && echo "ENTSOE_TOKEN=${{ secrets.ENTSOE_TOKEN }}" >> .env || true
          [ -n "${{ secrets.NAP_API_KEY }}" ] && echo "NAP_API_KEY=${{ secrets.NAP_API_KEY }}" >> .env || true
          cat .env 2>/dev/null | sed 's/=.*/=<oculto>/' || echo "sin .env"

      - name: Capas vivas
        # una fuente caida NO puede teñir de rojo el repo (el dato anterior sigue publicado y su
        # fecha lo delata), pero tampoco puede pasar en silencio: cada script que falle deja una
        # anotacion de aviso en la ejecucion.
        continue-on-error: true
        run: |
          for s in "ree_vivo.py" "omie.py" "entsoe.py --mix" "aemet_geo.py" "dgt_rt.py --incidencias" "dgt_rt.py --paneles" "ree_estado.py" "esios_prevision.py" "clima.py"; do
            echo "=== $s ==="
            rc=0
            salida=$(python scripts/$s 2>&1) || rc=$?
            echo "$salida" | tail -4
            if [ "$rc" -eq 3 ]; then
              echo "::notice title=Sin clave::$s necesita una clave que no esta en los secrets · se salta"
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Fuente caida::$s salio con codigo $rc · se mantiene el fichero anterior"
            fi
          done

      - name: Catalogo y cifras
        continue-on-error: true
        run: |
          # los agregados de la barra de KPIs se cuentan DESPUES de que las capas vivas se hayan
          # refrescado: si no, la cifra de arriba va un ciclo por detras de su fuente
          python scripts/agregados.py || true
          python scripts/fuentes_visor.py || true
          python scripts/catalogo.py || true
          python scripts/cifras.py || true
          python scripts/snapshot.py || true
          # burbujas nacionales de las capas de puntos (50-100 KB por capa): el visor las pinta
          # mientras el GeoJSON completo viaja. Incremental: solo regenera las que cambiaron.
          python scripts/resumen_puntos.py || true

      - name: Validador
        # El validador NO puede congelar el dato. Pasó: la DGT añadió el código DATEX
        # `heavyTraffic`, el validador salió rojo por «código sin traducir» y el paso de commit
        # nunca se ejecutó: los paneles «en vivo» se quedaron tres horas con la demanda de las
        # 15:25 y sin decirlo. El gate estricto es validar.yml, que corre en cada push; aquí el
        # rojo deja un aviso en la ejecución pero los datos se publican igual.
        continue-on-error: true
        run: python scripts/validar.py

      - name: Commit de los datos refrescados
        run: |
          git config user.name "OpenInfraES bot"
          git config user.email "bot@users.noreply.github.com"
          # OJO: un pathspec que no existe tumba el `git add` ENTERO ("fatal: pathspec
          # 'PROYECTO.md' did not match any files") y el `|| true` lo tapaba: los datos se
          # refrescaban y nunca se commiteaban. Se añade fichero a fichero, solo si existe.
          git add -A datos/
          for f in README.md docs/BIBLIOTECA.md PROYECTO.md GUIA.md; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: refresco automatico $(date -u +%Y-%m-%dT%H:%MZ)"
            # La VM tambien publica en main (openinfra-vivo, cada hora). Un `git push` pelado
            # muere con "! [rejected] main -> main (fetch first)" en cuanto los dos coinciden:
            # era el rojo mas repetido del repo. Pull con rebase + 3 intentos; si aun asi no
            # entra, el run queda rojo de verdad (no se tapa el fallo).
            ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main || { git rebase --abort || true; }
              if git push origin HEAD:main; then ok=1; break; fi
              echo "push rechazado (intento $i/3): reintento en $((i*5))s"
              sleep $((i*5))
              git fetch -q origin
            done
            [ "$ok" -eq 1 ] || { echo "::error title=Publicacion::no se pudo empujar tras 3 intentos"; exit 1; }
          fi

  # Renta municipal del INE (atlas de distribución de renta): alimenta el bloque «INE» de la ficha.
  # Es un dato anual y son 540 tablas de la API, así que va en su propio job con su propio tiempo y
  # sólo el día 3. `--si-caduca` lo deja en unos segundos cuando ya está el año.
  ine:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '23 5 3 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Renta municipal (INE · atlas de renta)
        run: python3 scripts/ine_municipios.py --si-caduca

      - name: Guardar si cambió
        run: |
          git config user.name  "OpenInfraES bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/ine/municipios.json datos/ine/_recibo_municipios.json || true
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: renta municipal del INE ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main && git push origin main
          fi
