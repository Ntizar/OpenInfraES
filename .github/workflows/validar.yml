name: Validar datos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validar cuadres de datos
        # OJO: sin `run: |` YAML pliega las dos líneas en UNA y validar.py acaba siendo un
        # argumento de cifras.py (rc=0, verde, y el gate de recibos sin correr nunca).
        run: |
          # `cifras.py --check` compara la tabla del README con los datos del momento. Los dos
          # publicadores (Action y VM) commitean cada hora por separado, así que ese desfase
          # aparece a media cadena sin que haya nada mal: era la causa de 7 rojos en 11 h.
          # Se avisa, no se bloquea. Lo que sí bloquea es validar.py (contrato de capas/recibos).
          python scripts/cifras.py --check || echo "::warning title=Cifras desfasadas::README.md no cuadra con los datos de este commit · lo regenera el siguiente refresco"
          python scripts/validar.py
      - name: Sintaxis
        run: |
          python -m py_compile scripts/descargar.py
          python -m py_compile scripts/agregar.py
          python -m py_compile scripts/validar.py
          python -m py_compile scripts/mcp_openinfra.py
          python -m py_compile scripts/chat_web.py
      - name: MCP federado
        # Habla con el servidor como cliente MCP real: handshake, tools/list y una
        # llamada por herramienta comprobando el contenido. Si una capa falta o el
        # framing se rompe, esto se pone rojo antes que el agente que lo use.
        run: python scripts/mcp_openinfra.py --test
