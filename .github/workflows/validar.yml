name: Validar datos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar cuadres de datos
        # OJO: sin `run: |` YAML pliega las dos líneas en UNA y validar.py acaba siendo un
        # argumento de cifras.py (rc=0, verde, y el gate de recibos sin correr nunca).
        run: |
          python scripts/cifras.py --check
          python scripts/validar.py
      - name: Sintaxis
        run: |
          python -m compileall -q scripts
